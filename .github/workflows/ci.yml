name: Foundation CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ['27018:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27018/recipe-hub-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps firefox
      - run: npm run test:e2e
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-diagnostics
          path: |
            test-results/**/screenshots/*.png
            test-results/**/verification/*.json
            test-results/**/*-actual.png
            test-results/**/*-expected.png
            test-results/**/*-diff.png
          retention-days: 7
          if-no-files-found: ignore
