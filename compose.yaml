name: recipe-hub
services:
  mongo:
    image: mongo:8.0
    ports:
      - '127.0.0.1:27019:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          'quit(db.adminCommand({ping:1}).ok ? 0 : 1)',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  mongo-test:
    image: mongo:8.0
    profiles: ['test']
    ports:
      - '127.0.0.1:27018:27017'
    tmpfs:
      - /data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          'quit(db.adminCommand({ping:1}).ok ? 0 : 1)',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mongo-data:
