  /api/v1/admin/reports/{reportId}/resolve:
    patch:
      operationId: resolveReport
      tags:
        - Moderation
      summary: Resolve or reject pending report with durable audit
      description:
        Required Idempotency-Key, report version. pending→resolved|rejected only; rejected
        requires action none. hide requires targetVersion; none forbids it and permits already
        deleted/missing target. Durable report claim→audited target CAS→report finalization→audit
        projection.503 means uncertain, replay same key or reconcile CLI. Stale competing Admin409.
      security:
        - SessionCookie: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema: *a3
        - $ref: '#/components/parameters/CsrfToken'
        - *a6
      responses:
        '200':
          description: Success; Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/ModerationReceiptDTO'
                required:
                  - success
                  - data
        '400':
          description: Invalid ID/query/header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: CSRF_INVALID or FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Invisible, unavailable or not owned
