          in: query
          schema:
            type: string
            enum:
              - publishedAt
              - -publishedAt
            default: -publishedAt
        - name: q
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 120
          description:
            1..10 normalized words; no markup/control characters. AND exact words, accents/case
            folded.
          example: thit kho trung
        - name: category
          in: query
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
          description:
            Category ObjectId; missing returns empty. Inactive category does not auto-hide
            previously published recipes.
        - name: tag
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 40
          description: Exact NFC/trim/lowercase tag, accent-sensitive. No markup/control characters.
          example: bữa tối
        - name: difficulty
          in: query
          schema:
            type: string
            enum:
              - easy
              - medium
              - hard
          description: Exact difficulty.
        - name: maxMinutes
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 2880
          description: Inclusive upper bound on server-calculated totalMinutes; null excluded.
        - name: ingredientIds
          in: query
          schema:
            type: string
            maxLength: 499
            pattern: ^[a-fA-F0-9]{24}(,[a-fA-F0-9]{24}){0,19}$
          description:
            Single comma-separated string of 1..20 IDs (before deduplication), no spaces/repeated
            keys/bracket arrays. IDs deduplicated. Canonical IDs only, not free-text ingredient
            names.
        - name: ingredientMatch
          in: query
          schema:
            type: string
            enum:
              - any
              - all
          description:
            Default any when ingredientIds is present. Requires ingredientIds. all requires every
            distinct ID on the same recipe.
      responses:
        '200':
          description: Success. No-store. Image URLs remain null until durable delivery is available.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicRecipeCardDTO'
                  meta:
                    type: object
                    additionalProperties: false
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
