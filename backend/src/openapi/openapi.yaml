  /api/v1/auth/change-password:
    post:
      operationId: changePassword
      tags:
        - Auth
      summary: Đổi mật khẩu
      description: Cần active session. Thu hồi mọi phiên/outstanding tokens, xóa cookie. Đăng nhập lại.
      security:
        - SessionCookie: []
      parameters:
