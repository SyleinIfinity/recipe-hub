openapi: 3.1.0
info:
  title: Recipe Hub API
  version: 0.13.0
  description: >-
    Live APIs BE-00..13 (private media upload/list/delete). Docs development only. Cookie HttpOnly
    do browser quản lý, không dán session token vào Authorize.


    Manual Try it out: GET /api/v1/auth/csrf → copy data.csrfToken vào X-CSRF-Token → login → GET
    csrf lại → mutation. Token trước login không dùng sau login. Backend origin cần nằm trong
    APP_ORIGINS.


    Email endpoints có thể gửi thư nếu SMTP bật; chỉ thử khi được phép. 202 không chứng minh
    delivery. Admin được cấp qua quy trình quản trị, không có public API cấp quyền. Recipe draft
    owner CRUD và publish/unpublish/public read đã live; P2 chưa có; media có upload/list/delete;
    attach/release là internal service. Search/filter/favorites live. Cloudinary live and binary
    delivery deferred until Frontend integration. Reviews, comments (one reply level), reports and
    audited moderation live. Mongo standalone durable intents; no Notification/Feed/Cloudinary live.
servers:
  - url: /
    description: Cùng origin với backend
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Categories
  - name: Ingredients
  - name: Media
  - name: Recipes
    description: Owner drafts, publication, strict public visibility and fail-closed media gateway.
  - name: Favorites
    description: Private relations; visible public recipes only. A relation never grants private access.
  - name: Reviews
  - name: Comments
  - name: Reports
  - name: Moderation
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags:
        - Health
      summary: Liveness
      description: Không phụ thuộc MongoDB.
      security: []
      parameters: []
      responses:
        '200':
          description: Thành công.
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/LiveDTO'
                required:
                  - success
                  - data
        '500':
          $ref: '#/components/responses/InternalError'
  /health/ready:
    get:
      operationId: getReadiness
      tags:
        - Health
      summary: MongoDB readiness
      description: ''
      security: []
      parameters: []
      responses:
        '200':
          description: Thành công.
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/ReadyDTO'
                required:
                  - success
                  - data
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/health:
    get:
      operationId: getApiHealth
      tags:
        - Health
      summary: MongoDB readiness
      description: ''
      security: []
      parameters: []
      responses:
        '200':
          description: Thành công.
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/ReadyDTO'
                required:
                  - success
                  - data
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/csrf:
    get:
      operationId: getCsrf
      tags:
        - Auth
      summary: Lấy CSRF token
      description: Thiết lập browser/CSRF cookies HttpOnly. Lấy lại sau login.
      security: []
      parameters: []
      responses:
        '200':
          description: Thành công.
          headers:
            X-Request-ID:
              schema:
                type: string
            Cache-Control:
              schema:
                const: no-store
            Set-Cookie:
              schema:
                type: string
              description:
                Browser-managed HttpOnly cookies, Path=/, SameSite=Lax, Secure khi HTTPS; login có
                expires. Logout/change/reset xóa cookies. Không đọc hoặc dán giá trị session token.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/CsrfDTO'
                required:
                  - success
                  - data
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/register:
    post:
      operationId: register
      tags:
        - Auth
      summary: Đăng ký
      description: Role mặc định user, không tự đăng nhập.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: Thành công.
          headers:
            X-Request-ID:
              schema:
                type: string
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/PrivateUserDTO'
                required:
                  - success
                  - data
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: developer@example.test
              password: Example passphrase only
              displayName: Developer Test
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
        - Auth
      summary: Đăng nhập
      description:
        Set-Cookie HttpOnly. Lấy lại CSRF sau login. Sai email/password/suspended đều
        INVALID_CREDENTIALS.
