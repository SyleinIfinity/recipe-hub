        - averageRating
        - ratingCount
    ModerationReceiptDTO:
      type: object
      additionalProperties: false
      properties:
        auditId: *a3
        targetId: *a3
        targetType:
          type: string
          enum:
            - recipe
            - comment
            - report
        status:
          type: string
          enum:
            - normal
            - hidden
            - visible
            - resolved
            - rejected
        version: *a7
      required:
        - auditId
        - targetId
        - targetType
        - status
        - version
    AdminReportDTO:
      type: object
      additionalProperties: false
      properties:
        reportId: *a3
        targetType: *a11
        targetId: *a3
        status: *a12
        createdAt: *a8
        reporterId: *a3
        reason:
          type: string
          enum:
            - spam
            - abuse
            - copyright
            - other
        details:
          type: string
        reviewedBy: *a9
        reviewedAt:
          type:
            - string
            - 'null'
          format: date-time
        resolutionNote:
          type:
            - string
            - 'null'
        resolutionAction:
          type:
            - string
            - 'null'
          enum:
            - none
            - hide
            - null
        version: *a7
        processing:
          type: boolean
        target:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              properties:
                version: *a7
                status:
                  type: string
                recipeId: *a3
                available:
                  type: boolean
                title:
                  type:
                    - string
                    - 'null'
                content:
                  type:
                    - string
                    - 'null'
              required:
                - version
                - status
                - recipeId
                - available
                - title
                - content
      required:
        - reportId
        - targetType
        - targetId
        - status
        - createdAt
        - reporterId
        - reason
        - details
        - reviewedBy
        - reviewedAt
        - resolutionNote
        - resolutionAction
        - version
        - processing
        - target
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: GET /api/v1/auth/csrf cùng browser, lấy lại sau login. Không phải session token.
      schema:
        type: string
        minLength: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: INVALID_JSON hoặc VALIDATION_ERROR (params/query).
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: INVALID_JSON hoặc VALIDATION_ERROR (params/query).
            requestId: example-request-id
    Unauthorized:
      description: UNAUTHENTICATED (missing/expired/revoked/suspended session) hoặc INVALID_CREDENTIALS.
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: UNAUTHENTICATED
              message: UNAUTHENTICATED (missing/expired/revoked/suspended session) hoặc INVALID_CREDENTIALS.
            requestId: example-request-id
    Forbidden:
      description: CSRF_INVALID hoặc FORBIDDEN. CSRF kiểm tra trước authentication.
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: CSRF_INVALID
              message: CSRF_INVALID hoặc FORBIDDEN. CSRF kiểm tra trước authentication.
            requestId: example-request-id
    NotFound:
      description: USER_NOT_FOUND, CATEGORY_NOT_FOUND, INGREDIENT_NOT_FOUND hoặc NOT_FOUND.
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: USER_NOT_FOUND, CATEGORY_NOT_FOUND, INGREDIENT_NOT_FOUND hoặc NOT_FOUND.
            requestId: example-request-id
    Conflict:
      description:
        EMAIL_EXISTS, CATEGORY_SLUG_EXISTS, INGREDIENT_NAME_CONFLICT, VERSION_CONFLICT,
        SELF_STATUS_CHANGE, AUTH_STATE_CHANGED.
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: VERSION_CONFLICT
              message:
                EMAIL_EXISTS, CATEGORY_SLUG_EXISTS, INGREDIENT_NAME_CONFLICT, VERSION_CONFLICT,
                SELF_STATUS_CHANGE, AUTH_STATE_CHANGED.
            requestId: example-request-id
    PayloadTooLarge:
      description: JSON request vượt 100kb.
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: PAYLOAD_TOO_LARGE
              message: JSON request vượt 100kb.
            requestId: example-request-id
    UnsupportedMediaType:
      description: Request encoding không hỗ trợ.
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: Request encoding không hỗ trợ.
            requestId: example-request-id
    ValidationError:
      description: VALIDATION_ERROR (body), INVALID_TOKEN hoặc MEDIA_NOT_AVAILABLE.
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: VALIDATION_ERROR (body), INVALID_TOKEN hoặc MEDIA_NOT_AVAILABLE.
            requestId: example-request-id
    RateLimited:
      description: Shared sensitive bucket hoặc CSRF bucket.
      headers:
        X-Request-ID:
          schema:
            type: string
        Retry-After:
          schema:
            type: integer
            minimum: 0
          description: Seconds until retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: RATE_LIMITED
              message: Shared sensitive bucket hoặc CSRF bucket.
            requestId: example-request-id
    InternalError:
      description: Lỗi nội bộ đã sanitize.
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: INTERNAL_ERROR
              message: Lỗi nội bộ đã sanitize.
            requestId: example-request-id
    Unavailable:
      description: Readiness hoặc email disabled.
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: SERVICE_UNAVAILABLE
              message: Readiness hoặc email disabled.
            requestId: example-request-id
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: recipe-hub-session
      description:
        Browser-managed HttpOnly cookie. HTTPS dùng prefix __Host-; JSON runtime phản ánh tên
        thực tế. Login qua API, không nhập raw token.
