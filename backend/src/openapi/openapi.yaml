  /api/v1/admin/users:
    get:
      operationId: listUsers
      tags:
        - Users
      summary: Danh sách tài khoản (Admin)
      description: Chỉ active Admin. Sort createdAt DESC, _id DESC; query strict.
      security:
        - SessionCookie: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - suspended
      responses:
        '200':
          description: Thành công.
          headers:
            X-Request-ID:
              schema:
                type: string
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUserDTO'
                  meta:
                    $ref: '#/components/schemas/UserPaginationMeta'
                required:
                  - success
                  - data
                  - meta
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
