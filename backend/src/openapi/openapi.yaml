  /api/v1/media/images:
    post:
      operationId: uploadImage
      tags:
        - Media
      summary: Upload a private temporary image
      description:
        Requires dynamic mode and authenticated policy. BE-08 local fake provider only; live
        Cloudinary gated. Exactly one file/purpose. Reuse UUID key for retries with identical
        bytes/purpose. Pending identity is retained for reconciliation; URL is null.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MediaUploadRequest'
      responses:
        '201':
          description: Temporary private image; replay of a completed matching key returns the same asset.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/MediaAssetDTO'
        '400':
          description: Malformed multipart/query or missing/invalid Idempotency-Key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing/expired/suspended session (after CSRF).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing/invalid CSRF or forbidden origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Idempotency key conflict, pending/uncertain/rejected/expired upload; no automatic retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Image or multipart body too large.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: Unsupported MIME/signature or corrupt image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Invalid purpose, animated image or excessive dimensions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Upload rate, process capacity or 20 outstanding quota exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Mongo reservation/finalize or internal failure; no false success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Private policy unavailable, live blocked or storage rejected/uncertain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
