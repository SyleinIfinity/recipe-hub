                type: string
            Cache-Control:
              schema:
                const: no-store
            Set-Cookie:
              schema:
                type: string
              description:
                Browser-managed HttpOnly cookies, Path=/, SameSite=Lax, Secure khi HTTPS; login có
                expires. Logout/change/reset xóa cookies. Không đọc hoặc dán giá trị session token.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
