        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          pattern: \S
          description: Passphrase không trim, không toàn whitespace.
        displayName:
          type: string
          minLength: 2
          maxLength: 80
          description: Giới hạn sau trim.
      required:
        - email
        - password
        - displayName
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
          format: email
          description: Trim/lowercase trước validation; giới hạn sau trim.
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
      required:
        - email
        - password
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
