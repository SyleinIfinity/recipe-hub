  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      summary: Đăng xuất
      description:
        Cần active session. Revoke phiên hiện tại, clear session/CSRF cookies. Gọi lại trả 401
        nếu CSRF hợp lệ.
      security:
        - SessionCookie: []
      parameters:
