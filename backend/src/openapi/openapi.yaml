  /api/v1/admin/recipes/{recipeId}/moderation:
    patch:
      operationId: moderateRecipe
      tags:
        - Moderation
      summary: Hide or restore recipe moderation with audit
      description:
        Required key + version + reason for both states. Historically published,
        complete/notdeleted target only. Change moderationStatus/version/reason, never publish/alter
        content/ownership/media/slug. Durable audit intent before target CAS; pending marker blocks
        new decisions until repaired. Repeated same-key replay original receipt200, new key
        same-state409.
